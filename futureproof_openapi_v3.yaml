# FutureProof v3.2 spec. Same server and bearerAuth as v3.1 (Authentication tab
# does NOT change). Changes: sex is M or F only; the "one question at a time"
# instruction is replaced by "ask all missing items in one message"; income can
# no longer be assumed to be 0; eq_w and income must come from the user;
# contrib must be confirmed; added a check that the returned inputs match.
openapi: 3.0.3
info:
  title: FutureProof Retirement Simulator
  version: 3.2.0
  description: >
    Runs the FutureProof Monte Carlo retirement simulation (SAS Job Execution)
    and returns the chance that the savings last, the expected age at death and
    the savings at retirement. All money amounts are in today's dollars. The
    run takes about 15 seconds.
servers:
  - url: https://viya-3tzzrqm1rj.engage.sas.com
paths:
  /SASJobExecution/:
    get:
      operationId: run_retirement_simulation
      summary: Run the FutureProof Monte Carlo retirement simulation
      description: >
        Use this tool whenever the user asks whether their retirement savings
        will last, how likely they are to run out of money, what happens if
        they spend more or less, retire earlier or later, save more, or hold
        more or fewer stocks. Never estimate a probability yourself: always
        call this tool and report only the numbers it returns.
        Before calling, ask for ALL missing required inputs together in one
        message, not one at a time. Never invent or assume income or the stock
        share: both must come from the user, because the saving share (contrib)
        is calculated from income and the stock share changes the result a lot.
        Only age, savings, spending and saving may be set to 0, and only with
        the user's agreement. Convert monthly amounts to yearly amounts
        (multiply by 12) and confirm the conversion with the user. Express the
        stock share as a fraction (60 percent is 0.6). Compute contrib as
        yearly saving divided by yearly income and confirm it with the user.
        The result probabilities are fractions between 0 and 1; show them as
        percentages (0.902 is 90.2 percent). After the call, compare the
        inputs block with what the user confirmed; if any value differs, tell
        the user and do not present the result as final. To compare scenarios,
        call the tool once per scenario and change only one input at a time.
        The call takes about 15 seconds; tell the user to wait.
      security:
        - bearerAuth: []
      parameters:
        - name: _program
          in: query
          required: true
          description: Fixed SAS job path. Do not change.
          schema:
            type: string
            enum:
              - /Public/Mariangela/FPMC_agenticAI_job
            default: /Public/Mariangela/FPMC_agenticAI_job
        - name: _output_type
          in: query
          required: true
          description: Fixed output format. Do not change.
          schema:
            type: string
            enum: [json]
            default: json
        - name: w0
          in: query
          required: true
          description: Starting savings (portfolio value) in today's dollars.
          schema:
            type: number
            minimum: 0
            maximum: 50000000
            example: 115600
        - name: wd_amount
          in: query
          required: true
          description: >
            Yearly spending taken from savings in retirement, in today's
            dollars (monthly spending times 12).
          schema:
            type: number
            minimum: 0
            maximum: 5000000
            example: 65040
        - name: income
          in: query
          required: true
          description: >
            Yearly income in today's dollars (monthly income times 12). Must
            come from the user. Never send 0 for a user who saves money,
            because contrib is a share of income and a 0 income makes the
            saving disappear from the run.
          schema:
            type: number
            minimum: 0
            maximum: 5000000
            example: 85900
        - name: start_age
          in: query
          required: true
          description: The user's current age in years.
          schema:
            type: integer
            minimum: 18
            maximum: 90
            example: 30
        - name: sex
          in: query
          required: true
          description: >
            Sex used for life expectancy. Send exactly M for male or F for
            female. No other value is accepted.
          schema:
            type: string
            enum: [M, F]
            example: M
        - name: ret_age
          in: query
          required: true
          description: >
            Age at which the user stops saving and starts spending from
            savings (retirement age).
          schema:
            type: integer
            minimum: 40
            maximum: 95
            example: 75
        - name: eq_w
          in: query
          required: true
          description: >
            Equity share, the part of the savings held in stocks, as a
            fraction between 0 and 1 (0.6 means 60 percent). More stocks mean
            more growth and bigger swings. The user must give or approve this
            value; do not guess and do not default it to 0.
          schema:
            type: number
            minimum: 0
            maximum: 1
            example: 0.6
        - name: contrib
          in: query
          required: true
          description: >
            Share of yearly income the user saves before retirement, as a
            fraction between 0 and 1. Compute it as yearly saving divided by
            yearly income (for example 12360 saved on an income of 85900 is
            0.144) and confirm it with the user. Use 0 only if the user saves
            nothing. Never send 0 because income is unknown; ask for income
            instead.
          schema:
            type: number
            minimum: 0
            maximum: 1
            example: 0.144
        - name: health
          in: query
          required: false
          description: >
            Health compared with the average person. It adjusts how long the
            user is likely to live. Defaults to average.
          schema:
            type: string
            enum: [better, average, worse]
            default: average
      responses:
        "200":
          description: >
            Simulation result. The inputs block repeats what the job actually
            used; check it against what the user confirmed. Explain each figure
            in plain words. Report only fields that are present; never add
            fields that are not in the response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    description: The text ok when the run succeeded.
                  inputs:
                    type: object
                    additionalProperties: true
                    description: The inputs the job used, including defaults.
                  results:
                    type: object
                    additionalProperties: true
                    properties:
                      p_success_lifetime:
                        type: number
                        description: >
                          Chance money lasts a lifetime, as a fraction
                          (0.902 is 90.2 percent). Out of 100 possible
                          futures, how many times the savings outlive the
                          user.
                      p_success_to_95:
                        type: number
                        description: >
                          Chance money lasts to 95, as a fraction. The same,
                          but as if the user lived to 95. A stricter test.
                      expected_age_at_death:
                        type: number
                        description: Expected age at death, in years.
                      wealth_at_retirement_p10:
                        type: number
                        description: >
                          Savings at retirement in a poor case (the 10th
                          percentile), in today's dollars.
                      wealth_at_retirement_median:
                        type: number
                        description: >
                          Typical savings at retirement: half of the futures
                          end above this, half below, in today's dollars.
                      wealth_at_retirement_p90:
                        type: number
                        description: >
                          Savings at retirement in a good case (the 90th
                          percentile), in today's dollars.
                      spending_rate_vs_median_wealth:
                        type: number
                        description: >
                          Yearly spending as a fraction of the typical
                          savings at retirement (0.04 is 4 percent).
        "400":
          description: An input is missing or outside its allowed range.
        "401":
          description: Missing or expired token
        "403":
          description: Token valid but no permission on the job or folder
        "404":
          description: Job path not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
