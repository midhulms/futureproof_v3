# FutureProof v4.0 spec for SAS job v3 (/Public/Mariangela/FPMC_agenticAI_job).
# Same server and same bearerAuth: the Authentication tab does NOT change.
# Design: 5 core inputs + monthly spending/saving go straight to the job
# (the job multiplies by 12). Every optional input is OMITTED when the user
# does not give it, so the job's own default applies. Never send 0 for an
# unknown value.
openapi: 3.0.3
info:
  title: FutureProof Retirement Simulator
  version: 4.0.0
  description: >
    Runs the FutureProof Monte Carlo retirement simulation (SAS Job Execution).
    All money amounts are in today's dollars. The run takes about 15 seconds.
servers:
  - url: https://viya-3tzzrqm1rj.engage.sas.com
paths:
  /SASJobExecution/:
    get:
      operationId: run_retirement_simulation
      summary: Run the FutureProof Monte Carlo retirement simulation
      description: >
        Use for any question about whether retirement savings will last, the
        chance of running out of money, or a what-if (retire earlier or later,
        spend more or less, save more, hold more or fewer stocks, different
        health). Never estimate a probability yourself.
        INPUT RULES.
        (1) The seven required inputs (w0, spend_month, start_age, sex,
        ret_age, plus the fixed _program and _output_type) must come from the
        user's own words. If one is missing, do not call the tool; ask.
        (2) w0, spend_month, contrib_month and pension_month are plain dollar
        amounts. spend_month, contrib_month and pension_month are MONTHLY:
        send the number the user gave, do not multiply by 12 (the job does
        it). If the user gave a yearly amount, divide it by 12.
        (3) Copy digits exactly: 1,030 is 1030, not 103; 3,420 is 3420;
        120,100 is 120100. Re-read each number against the user's message
        before sending.
        (4) OPTIONAL inputs (contrib_month, contrib_growth, growth_years,
        eq_w, health, pension_month, pension_age): send ONLY if the user gave
        them. If the user says they do not have it, skip it, or does not
        answer, OMIT the parameter. Never send 0, a guess, or a typical value
        in its place, because that changes the result. The job applies its own
        standard setting when a parameter is absent.
        (5) Do not send any parameter that is not listed here.
        OUTPUT RULES. Report only numbers present in the response. Fractions
        become percentages (0.902 = 90.2 percent). A null value means the
        figure does not apply; say so in words, never as a number. After the
        call, compare the echoed inputs with the user's values (see the
        response description). To compare scenarios, call once per scenario,
        change only one input, keep every other parameter exactly as before
        (including omitted ones).
      security:
        - bearerAuth: []
      parameters:
        - name: _program
          in: query
          required: true
          description: Fixed SAS job path. Do not change.
          schema:
            type: string
            enum: [/Public/Mariangela/FPMC_agenticAI_job]
        - name: _output_type
          in: query
          required: true
          description: Fixed output format. Do not change.
          schema:
            type: string
            enum: [json]
        - name: start_age
          in: query
          required: true
          description: The user's current age in years. Must be stated by the user.
          schema:
            type: integer
            minimum: 18
            maximum: 100
        - name: sex
          in: query
          required: true
          description: Exactly M or F, for life expectancy. Must be stated by the user.
          schema:
            type: string
            enum: [M, F]
        - name: w0
          in: query
          required: true
          description: Savings today in dollars. Must be stated by the user.
          schema:
            type: number
            minimum: 0
            maximum: 1000000000
        - name: spend_month
          in: query
          required: true
          description: >
            MONTHLY spending taken from savings in retirement, in today's
            dollars. Send the monthly figure as given (do not multiply by 12).
          schema:
            type: number
            minimum: 1
            maximum: 10000000
        - name: ret_age
          in: query
          required: true
          description: Age at which the user stops saving and starts spending from savings.
          schema:
            type: integer
            minimum: 50
            maximum: 80
        - name: contrib_month
          in: query
          required: false
          description: >
            OPTIONAL. MONTHLY saving before retirement, in dollars. Send only
            if the user gave an amount. If the user saves nothing or does not
            say, omit it (do not send 0).
          schema:
            type: number
            minimum: 0
            maximum: 1000000
        - name: contrib_growth
          in: query
          required: false
          description: >
            OPTIONAL. Yearly growth of the saving amount above inflation.
            Send only if the user chose one of the three choices.
          schema:
            type: number
            enum: [0, 0.01, 0.03]
        - name: growth_years
          in: query
          required: false
          description: >
            OPTIONAL. Number of years the saving keeps growing. Send only if
            the user named a number and contrib_growth is sent.
          schema:
            type: integer
            minimum: 0
            maximum: 50
        - name: eq_w
          in: query
          required: false
          description: >
            OPTIONAL. Share of savings in stocks as a fraction (0.6 = 60
            percent). Send only if the user gave it; otherwise omit.
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: health
          in: query
          required: false
          description: >
            OPTIONAL. Health compared with the average person. Send only if
            the user gave it; otherwise omit.
          schema:
            type: string
            enum: [better, average, worse]
        - name: pension_month
          in: query
          required: false
          description: >
            OPTIONAL. MONTHLY pension, annuity or other guaranteed income in
            retirement, in dollars (the user's own estimate). Send only if the
            user has one; otherwise omit.
          schema:
            type: number
            minimum: 0
            maximum: 1000000
        - name: pension_age
          in: query
          required: false
          description: >
            OPTIONAL. Age at which the guaranteed income starts. Send only if
            the user gave it.
          schema:
            type: integer
            minimum: 50
            maximum: 80
      responses:
        "200":
          description: >
            Simulation result. The inputs block repeats what the job used.
            Compare start_age, sex, w0, spend_month, ret_age and
            saving_per_month with what the user said (saving_per_month is
            dollars per month, saving_per_year is yearly; eq_w, health and
            ss_income show the job's standard settings when the user gave
            none). Report only fields that are present.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                    description: ok when the run succeeded; error otherwise (see message).
                  message:
                    type: string
                    description: Error text when status is error.
                  inputs:
                    type: object
                    additionalProperties: true
                    description: >
                      Inputs the job used, including defaults: start_age, sex,
                      w0, wd_amount (yearly spending), spend_month, ret_age,
                      eq_w, saving_per_year, saving_per_month, contrib_growth,
                      growth_years, health, mort_adj, ss_income, ss_age.
                  results:
                    type: object
                    additionalProperties: true
                    properties:
                      p_success_lifetime:
                        type: number
                        description: Chance money lasts a lifetime, fraction.
                      p_success_to_95:
                        type: number
                        description: Chance money lasts to age 95, fraction.
                      expected_age_at_death:
                        type: number
                        description: Expected age at death, years.
                      wealth_at_retirement_p10:
                        type: number
                        description: Savings at retirement, poor case (1 in 10 below), today's dollars.
                      wealth_at_retirement_median:
                        type: number
                        description: Typical savings at retirement, today's dollars.
                      wealth_at_retirement_p90:
                        type: number
                        description: Savings at retirement, good case (1 in 10 above), today's dollars.
                      spending_rate_vs_median_wealth:
                        type: number
                        nullable: true
                        description: Yearly spending divided by typical savings at retirement (0.04 = 4 percent).
                      wealth_at_85_p10:
                        type: number
                        nullable: true
                        description: Savings at age 85, poor case, today's dollars.
                      wealth_at_85_median:
                        type: number
                        nullable: true
                        description: Typical savings at age 85, today's dollars.
                      wealth_at_95_p10:
                        type: number
                        nullable: true
                        description: Savings at age 95, poor case, today's dollars.
                      wealth_at_95_median:
                        type: number
                        nullable: true
                        description: Typical savings at age 95, today's dollars.
                      age_10pct_paths_run_out:
                        type: number
                        nullable: true
                        description: >
                          Age by which the money is gone in 1 in 10 simulated
                          futures (whether or not the person is still alive
                          then). null means fewer than 1 in 10 futures ever
                          run out. Never call this the age of death or the
                          age the plan fails for the user.
                      earliest_ret_age_for_target:
                        type: number
                        nullable: true
                        description: >
                          Earliest retirement age between 60 and 70 with at
                          least a 90 percent chance money lasts a lifetime.
                          null means not reached between 60 and 70.
                  alternatives:
                    type: array
                    description: Spending 20% less, 10% less, same, 10% more.
                    items:
                      type: object
                      properties:
                        wd_amount:
                          type: number
                          description: Yearly spending in that scenario, today's dollars.
                        p_success_lifetime:
                          type: number
                        p_success_to_95:
                          type: number
                  sensitivity:
                    type: array
                    description: One-change levers with gain or loss in points.
                    items:
                      type: object
                      properties:
                        lever:
                          type: string
                        p_success_lifetime:
                          type: number
                        change_pp:
                          type: number
                          description: Change in points versus the user's plan.
                  retirement_age_scan:
                    type: array
                    description: Chance money lasts for retirement ages 60 to 70.
                    items:
                      type: object
                      properties:
                        ret_age:
                          type: integer
                        p_success_lifetime:
                          type: number
                        p_success_to_95:
                          type: number
        "400":
          description: An input is missing or outside its allowed range.
        "401":
          description: Missing or expired token
        "403":
          description: Token valid but no permission on the job or folder
        "404":
          description: Job path not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
